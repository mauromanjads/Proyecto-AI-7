<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>NEXUS</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/agentes.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/mensajes.css">
    <link rel="stylesheet" href="css/confirmacion.css">
    <link rel="stylesheet" href="css/prologo.css">
    <link rel="stylesheet" href="css/capitulo.css">
    <link rel="stylesheet" href="css/caso.css">
    <link rel="stylesheet" href="css/eventos.css">
    <link rel="stylesheet" href="css/tableroagentes.css">
    <link rel="stylesheet" href="css/pointerglobal.css">
    <link rel="stylesheet" href="css/tubos.css">

</head>

<body>

    <!-- ==================================================
         PRÓLOGO
         ================================================== -->

    <section id="pantalla-prologo">

        <div class="prologo-contenido">

            <h1 id="prologo-titulo"></h1>

            <div id="prologo-texto"></div>

            <div class="prologo-controles">

                <div id="prologo-progreso">

                    <div id="prologo-puntos"></div>

                    <span id="prologo-contador"></span>

                </div>

                <div class="prologo-navegacion">

                    <button
                        id="btn-prologo-atras"
                        type="button">
                        ATRÁS
                    </button>

                    <button
                        id="btn-prologo"
                        type="button">
                        CONTINUAR
                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- ==================================================
         JUEGO
         ================================================== -->

    <div id="pantalla-juego">

        <header>

            <!-- ==================================================
                 IDENTIDAD DEL SISTEMA
                 ================================================== -->

            <div class="logo-ai7">

                <span>NEXUS</span>

            </div>


            <!-- ==================================================
                 LÍNEA DECORATIVA
                 ================================================== -->

            <div class="linea-header"></div>


            <!-- ==================================================
                 TÍTULO DINÁMICO DEL CAPÍTULO
                 ==================================================

                 El título se carga desde capitulo1.js,
                 capitulo2.js, etc.

                 Ejemplo:

                 EL PRIMER INCIDENTE

                 ================================================== -->

            <h1 id="titulo-capitulo"></h1>


            <!-- ==================================================
                 PROGRESO
                 ================================================== -->

            <div id="progreso"></div>

        </header>


        <!-- ==================================================
             CONTENIDO PRINCIPAL
             ================================================== -->

        <main>


            <!-- ==================================================
                 INFORMACIÓN DEL CASO
                 ================================================== -->

            <section class="panel">

                <div id="caso"></div>

            </section>


            <!-- ==================================================
                 AGENTES
                 ================================================== -->

            <section class="panel">

                <div id="tablero-agentes"></div>
                <div id="agentes"></div>

            </section>


            <!-- ==================================================
                 RESULTADO
                 ==================================================

                 Se mantiene temporalmente.

                 Más adelante se eliminará cuando terminemos
                 el desarrollo y las respuestas ya no deban
                 mostrarse visualmente.

                 ================================================== -->

            <section class="panel">

                <div id="resultado"></div>

            </section>


        </main>

    </div>


    <!-- ==================================================
         APLICACIÓN
         ================================================== -->

    <script
        type="module"
        src="js/app.js">
    </script>

</body>

</html>
