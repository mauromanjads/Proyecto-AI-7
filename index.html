<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <title>AI-7</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/agentes.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/mensajes.css">
    <link rel="stylesheet" href="css/confirmacion.css">
    <link rel="stylesheet" href="css/prologo.css">

</head>

<body>

    <!-- ==================================================
         PRÓLOGO
         ================================================== -->

    <section id="pantalla-prologo">

        <div class="prologo-contenido">

            <h1 id="prologo-titulo"></h1>

            <div id="prologo-texto"></div>

           
                <div class="prologo-controles">

                    <span id="prologo-progreso"></span>

                    <div class="prologo-navegacion">

                        <button
                            id="btn-prologo-atras"
                            type="button">
                            ATRÁS
                        </button>

                        <button
                            id="btn-prologo"
                            type="button">
                            CONTINUAR
                        </button>

                    </div>

                </div>
                            

        </div>

    </section>


    <!-- ==================================================
         JUEGO
         ================================================== -->

    <div id="pantalla-juego">

        <header>

            <div class="logo-ai7">
                <span>AI</span><strong>-7</strong>
            </div>

            <div class="linea-header"></div>

            <h2>PROTOCOLO DE INVESTIGACIÓN</h2>

            <p>
                Analiza las declaraciones.
                Descubre las contradicciones.
                Encuentra la verdad.
            </p>

        </header>


        <main>

            <section class="panel">

                <div id="progreso"></div>

                <h2>Agentes</h2>

                <div id="agentes"></div>

            </section>


            <section class="panel">

                <h2>Caso</h2>

                <div id="caso"></div>

            </section>


            <section class="panel">

                <h2>Declaraciones</h2>

                <div id="declaraciones"></div>

            </section>


            <section class="panel">

                <h2>Resultado</h2>

                <div id="resultado"></div>

            </section>

        </main>

    </div>


    <script type="module" src="js/app.js"></script>

</body>

</html>
